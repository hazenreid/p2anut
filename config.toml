corpus_file = "corpus.bin"
# 글자 배열 코퍼스에 섞을 러스트 코드의 비율 (글자 수 기준, 0~1). 0이면 위키 영어만.
# 코드는 [code]의 크레이트를 위키와 같은 규칙으로 센 것 (code.letters.bin: 양옆이 글자인 공백만 세고, 기호·숫자 옆 공백은 연속을 끊음)
code_share = 0.25
# 스페이스는 3×10 배열 안의 27번째 키로 함께 배치함 (예전 grid 결과 파일 이름 그대로). 결과는 늘 스페이스가 오른손 쪽
# (점수가 좌우 대칭이라 왼손이면 좌우를 뒤집어 저장함. 왼손 스페이스는 symbols N --flip).
# code_share가 0보다 크면 이름에 비율이 붙어 따로 저장됨 (result-grid-code25.bin)
result_file = "result-grid.bin"
elites = 5
# 각 손(왼손·오른손)이 최소 이 비율 이상 치면 감점 없음 (0.45 = 45~55%)
min_hand_usage = 0.45
# 덜 치는 손이 min_hand_usage보다 모자라면 글자 100개당 hand_penalty × (모자란 %p)² 감점 (1.0: 44% → +1, 43% → +4, 42% → +9)
hand_penalty = 1.0
# 이 비율보다 적게 치는 손이 있으면 실격 (없으면 min_hand_usage와 같아서 기준 아래는 바로 실격)
hand_hard_limit = 0.40
min_home_diff = 2
# 멀티스트림 덤프: 여러 스레드로 나눠 분석하고, 중단해도 이어서 분석 (일반 *-pages-articles.xml.bz2는 한 스레드, 이어서 분석 불가)
# 주소를 여러 개 적으면 받기 전에 하나씩 차례로 속도를 잼 (곳마다 최대 8초·32MiB, 연결 초반을 뺀 뒤쪽 절반의 속도).
# 응답이 없거나 파일 크기가 다른 주소(그 날짜판이 없는 미러 등)는 빠짐. 받는 방식은 아래 wikipedia_parallel_download
# 모든 주소는 파일 이름이 같아야 함. 날짜판을 바꿀 때는 모든 주소의 날짜(두 군데씩)를 함께 바꾸기.
# 미러 목록: https://meta.wikimedia.org/wiki/Mirroring_Wikimedia_project_XML_dumps
# (2026-11 확인: Scatter는 최신이 2026-05-01판, Clarkson은 enwiki가 없고, aerotechnet은 응답이 없어서 뺌. 미러는 최근 2~5개 날짜판만 보관)
wikipedia_dump_url = [
  # 공식 (IP당 연결 수 제한)
  "https://dumps.wikimedia.org/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # 스웨덴 Umeå 대학 ACC (같은 기관의 두 주소)
  "https://mirror.accum.se/mirror/wikimedia.org/dumps/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  "https://ftp.acc.umu.se/mirror/wikimedia.org/dumps/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # Debian 서버의 Wikimedia 미러 (경로가 ACC와 같아 같은 기관의 세 번째 주소로 보임. 공식 목록에는 없음)
  "https://cdimage.debian.org/mirror/wikimedia.org/dumps/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # 미국 Your.org
  "https://dumps.wikimedia.your.org/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # 브라질 C3SL
  "https://wikipedia.c3sl.ufpr.br/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # 러시아 PDApps
  "https://wikipedia.mirror.pdapps.org/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
]
# 덤프를 result_path 아래에 먼저 받아 두기 (약 27GB, 끊기면 이어받기). 파일 이름은 URL의 마지막 부분
wikipedia_download = true
# 여러 미러에서 8MiB 덩어리를 나눠 동시에 받기: 미러마다 연결 하나, 같은 서버(같은 IP)의 여러 주소는 하나만,
# 가장 빠른 곳의 20% 미만은 예비 (쓰던 미러가 계속 실패하면 그 연결이 넘겨받음). 받은 덩어리는 <파일>.part.state에
# 기록해서 중단해도 남은 것만 이어받음. false면 가장 빠른 한 곳에서 받다가 계속 실패하면 다음 곳으로
wikipedia_parallel_download = true
# 다 받은 덤프를 Wikimedia가 공개하는 SHA-1과 비교 (여러 미러에서 섞어 받을 수 있으므로 켜 두기를 권장).
# 다르면 파일을 <이름>.bad로 옮기고 멈춤. 체크섬 파일을 못 구하면 경고만 하고 진행
wikipedia_verify = true
# 파일 이름을 직접 정하려면 (예: 이미 받아 둔 덤프)
# wikipedia_dump_file = "enwiki-latest-pages-articles.xml.bz2"
# 문서 표본 비율 (0 초과 1 이하, 제목 해시로 덤프 전체에서 고르게). 1 = 전부
wikipedia_sample = 1.0
# 덤프 앞쪽 N개 문서만 분석 (0 = 전체). 오래된 문서 위주라 편향되므로 빠른 확인용
wikipedia_limit = 0
# 최적화에 쓸 빅그램·트라이그램의 누적 빈도 비율 (1.0 = 전부, 낮출수록 빠름). 코퍼스 파일에는 전체를 저장하므로 바꿔도 재분석 불필요
bigram_coverage = 0.99
# 트라이그램 0.90이면 SFB·시저스가 약 13% 덜 잡힘 (위키 문서 3.5만 개 실측). 0.97은 약 6%, 0.99는 약 3% (이동 계산 1.6배·2.5배 느림)
trigram_coverage = 0.97
# 코퍼스 빈도 최하위 n글자를 가운데 두 열(검지 안쪽)에 강제 배치, 나머지 글자는 센터 금지 (0 = 끔, 3~6)
center_rare = 3
# 난수 시드 (없으면 실행 시 출력되는 값을 넣어 재현)
# seed = 12345

[weights]
gap = 0.90
# SFB·시저스의 행 페널티: 한 줄 차이마다 (1 + row)배 (롤의 행 배율은 아래 roll_row)
row = 0.97
center = 2.5
outroll = 0.70
# 롤에서 행이 한 번 바뀔 때마다 곱하는 값. 리다이렉트는 반대로 이 값으로 나눠서 행이 바뀌면 더 비싸짐.
# 0.85 = 행을 건너는 롤을 같은 행 롤보다 확실히 덜 쳐 줌 (중지 홈 → 검지 윗줄 74%, 윗줄끼리 83%, 홈끼리 100%).
# 1에 가까우면 행 이동 벌점이 거의 없고, 1을 넘으면 행을 건너는 롤이 오히려 더 좋게 쳐짐. 없으면 row와 같음
roll_row = 0.85
# 검지 없는 리다이렉트(나쁜 리다이렉트) 배율. [costs]의 redirect에 곱함 (커뮤니티에서 특히 나쁘게 봄)
bad_redirect = 2.0
# 나쁜 방향 하프 시저스 (인접 손가락 한 줄 차이, 긴 손가락이 아래): 롤이 아닌 시저스로 분류, 페널티 배율
half_scissors = 1.0
# 풀 시저스 중 편한 방향(긴 손가락이 위, 예: 중지 윗줄 + 검지 아랫줄) 페널티 배율. 나쁜 방향은 1.0 (1 = 구분 없음)
full_scissors_good = 0.5
# 스킵 풀 시저스(1·3번 키가 인접 손가락 두 줄 차이, 가운데 아무 키) 페널티 배율. 방향 구분은 풀 시저스와 같음. 0 = 끔
skip_scissors = 0.5
# 같은 손가락 스킵그램(사이에 다른 손가락 한 번) 페널티 배율. SFB와 같은 식에 곱함 (1 = SFB와 같은 무게).
# 사이에 한 번 치는 동안 손가락이 미리 움직일 수 있어 SFB보다 덜 불편하므로 낮춰 둠
sfs = 0.5
# 같은 키 스킵그램(ere, iti 등) 배율. 같은 글자는 어느 배열에서나 같은 키라 배열로 피할 수 없어서 0 (SFB도 같은 키 연속은 안 셈).
# 없으면 sfs와 같음
sfs_same_key = 0.0

[effort]
# 키마다의 노력값 (검지 홈 = 1.0 기준). 왼손 새끼 → 약지 → 중지 → 검지 → 가운데 열 순서, 오른손은 좌우 대칭.
# 노력값 비용(글자 빈도 × 노력값)과 SFB·시저스·롤·리다이렉트의 크기에 쓰임. [costs]의 대표 사건 비용은 이 표를 바꿔도 그대로
top    = [2.4, 1.3, 1.1, 1.3, 3.5]
home   = [1.6, 1.1, 1.0, 1.0, 3.0]
bottom = [2.2, 1.5, 1.3, 1.1, 4.0]

[costs]
# 총점 = 모든 항목을 "검지 홈 행 키 한 번 = 1" 단위의 비용으로 바꿔 더한 값 (결과에 글자 100개당 비용으로 표시).
# 대표 사건 한 번이 검지 홈 행 키를 몇 번 누르는 만큼인지. 나머지 사건은 [weights] 세부 배율로 자동 결정
# 키 노력값 배율 (1 = 노력값 표 그대로)
effort = 1.0
# SFB 한 번 (검지 홈 → 검지 윗줄). 안쪽 롤 하나와 같게 둬서 롤을 얻으려고 SFB를 감수하지 않게 함
sfb = 3.0
# 나쁜 방향 풀 시저스 한 번 (중지 아랫줄 → 검지 윗줄). 하프 시저스·편한 방향·스킵 시저스는 [weights] 배율로 이 값에서 줄어듦
# 9.6 = SFB(3.0)의 3.2배 (SFB 2.5, 시저스 8.0일 때의 비율 유지). 모든 시저스가 가장 나쁜 SFB(약 4.7)보다 비쌈
full_scissors = 9.6
# 안쪽 롤 한 번으로 아끼는 양 (중지 홈 → 검지 홈). 바깥쪽 롤은 outroll 배
inroll = 3.0
# 리다이렉트 한 번 (홈 행 약지 → 검지 → 중지). 같은 손 세 글자가 방향을 꺾으면 안의 두 쌍은 롤로 치지 않고 이 비용만 매김.
# 노력값이 큰 키·손가락 간격·행 이동이 있을수록 커지고, 검지가 없으면 bad_redirect배. inroll과는 독립
redirect = 1.0
# 가운데 열로 옆으로 뻗기(LSB) 한 번 (중지 홈 → 가운데 홈): 가운데 열 키와 같은 손 다른 손가락 키를 잇따라 치는 경우.
# 다른 LSB는 노력값 합과 행 이동에 비례하고 scissors 항목에 들어감. 9.6 = 나쁜 방향 풀 시저스와 같은 무게.
# 가운데 열 SFB(검지 → 가운데)는 SFB 식 × center 그대로 (약 6.6). 없으면 예전 동작 (약 12.6)
lateral = 9.6

[sa]
# 담금질 한 번: 최고점이 이만큼의 이동 동안 안 오르면 끝냄
max_no_improve = 1500
accept_start = 0.3
cooling = 0.998
# 엘리트마다 무작위 배열에서 시작하는 담금질을 이만큼씩 묶어 동시에 돌림 (최소 시작 횟수)
starts_per_batch = 40
# 같은 최고점이 이만큼 나오면 그 엘리트 탐색을 끝냄 (실측: 1등은 시작 5번 중 1번꼴로 닿음)
stop_after_hits = 3
# 시작 횟수 상한
max_starts = 2000

[code]
# 러스트 코드 코퍼스 (analyze-code가 만듦): 같은 크레이트를 두 규칙으로 셈. corpus_file은 심볼 레이어(symbols)용,
# 이름에 .letters가 붙은 파일(code.letters.bin)은 글자 배열(code_share)용 (위키와 같은 공백 규칙).
# 코드 코퍼스를 쓰는 명령은 파일이 없거나 crates가 바뀌었으면 먼저 만듦
corpus_file = "code.bin"
# 코드 코퍼스로 쓸 크레이트: crates.io에서 각각 최신 안정 버전만 받아 <result_path>/crates/에 풂 (의존성은 받지 않음).
# 크레이트마다 본체 코드(tests·benches·examples·build.rs 제외)를 모두 읽고, 크레이트끼리 같은 무게로 더함.
# 바꾸면 코드 코퍼스를 다시 만듦. 고른 규칙 (2026-11):
#   GitHub 스타 순으로 러스트 저장소를 보면서 만든 지 3년 이상, 주인(조직)당 하나, 목록·책·강의 저장소는 뺌.
#   crates.io에 올라온 본체 크레이트(저장소 이름이 든 크레이트, api·plugin·protocol·types·shared 같은 부속은 뺌)를
#   실행 파일이 있으면 프로그램, 없으면 라이브러리로 각각 20개까지. 본체 코드가 50KB(주석 제외) 미만이면
#   저장소 이름으로 시작하는 크레이트 중 코드가 가장 많은 것으로 대신하고, 그것도 50KB 미만이면 다음 순위.
#   손으로 고친 것: wezterm·biome(부속 크레이트뿐)·exa(eza로 이어짐)·coreutils(껍데기) 제외, polars는 라이브러리,
#   iced는 iced_widget
crates = [
  # 라이브러리
  "tauri", "sway-core", "typst-layout", "bevy_ecs", "parcel-resolver", "polars-plan", "servo",
  "swc", "tokio", "surrealdb", "yew", "jj-lib", "egui", "iced_widget",
  "pingora-http", "tree-sitter", "rocket", "turso", "actix-web", "oxc_ast",
  # 프로그램
  "deno", "uv", "ripgrep", "alacritty", "bat", "starship", "yazi-scheduler",
  "sniffnet", "zoxide", "just", "mise", "rustfs", "zellij", "git-delta",
  "atuin", "fnm", "difftastic", "eza", "gitui", "rustpython-codegen",
]

[symbols]
# 심볼 레이어 최적화 (symbols 명령): 기호 32개를 원샷 심볼 레이어 30칸과 베이스 배열의 빈칸에 배치. 코드 코퍼스만 씀.
# 심볼 레이어 기호가 이어지면 레이어 키를 누른 채로 쳐서 탭은 처음 한 번만 셈 (QMK OSL, ZMK sticky layer처럼 누르고 있으면
# 보통 레이어 키로 동작하는 펌웨어)
# 베이스 빈칸에 둔 기호의 추가 노력값 (같은 자리 노력값에 더함). 원샷 탭 비용(노력값 표의 가장 작은 값, 지금 1.0)보다
# 크면 심볼 레이어가 모자랄 때 가장 드문 기호만 베이스로 감
base_slot_extra = 3.0
# 순서 있는 짝: 첫 글자가 왼쪽. 같은 손 같은 줄에 나란히, 또는 좌우 대칭 (같은 손가락·같은 줄, 첫 글자가 왼손)
pairs = ["()", "[]", "{}", "<>"]
# 순서 없는 짝: 나란히, 좌우 대칭, 같은 열 위아래 중 하나 (어느 쪽이 먼저든)
loose_pairs = ["'\""]
# 담금질 한 번의 이동 횟수 (여러 번 시작하는 규칙은 [sa]의 starts_per_batch, stop_after_hits, max_starts)
steps = 100000
