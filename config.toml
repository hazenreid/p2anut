corpus_file = "corpus.bin"
result_file = "result.bin"
elites = 5
# 각 손(왼손·오른손)이 최소 이 비율 이상 입력을 맡아야 함 (0.5 이하, 0.45 = 45~55%)
min_hand_usage = 0.45
min_home_diff = 2
# 멀티스트림 덤프: 여러 스레드로 나눠 분석하고, 중단해도 이어서 분석 (일반 *-pages-articles.xml.bz2는 한 스레드, 이어서 분석 불가)
# 주소를 여러 개 적으면 받기 전에 각 주소에서 앞부분 4MiB를 받아 속도를 재고 빠른 곳부터 씀.
# 응답이 없거나 파일 크기가 다른 주소(그 날짜판이 없는 미러 등)는 빠지고, 받다가 계속 실패하면 다음 주소로 넘어가 이어받음.
# 모든 주소는 파일 이름이 같아야 함. 날짜판을 바꿀 때는 모든 주소의 날짜(두 군데씩)를 함께 바꾸기.
# 미러 목록: https://meta.wikimedia.org/wiki/Mirroring_Wikimedia_project_XML_dumps
# (2026-11 확인: Scatter·Clarkson은 날짜판이 오래돼서, aerotechnet은 응답이 없어서 뺌. 미러는 최근 2~5개 날짜판만 보관)
wikipedia_dump_url = [
  # 공식 (IP당 연결 수 제한)
  "https://dumps.wikimedia.org/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # 스웨덴 Umeå 대학 ACC (같은 기관의 두 주소)
  "https://mirror.accum.se/mirror/wikimedia.org/dumps/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  "https://ftp.acc.umu.se/mirror/wikimedia.org/dumps/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # 미국 Your.org
  "https://dumps.wikimedia.your.org/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # 브라질 C3SL
  "https://wikipedia.c3sl.ufpr.br/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
  # 러시아 PDApps
  "https://wikipedia.mirror.pdapps.org/enwiki/20261101/enwiki-20261101-pages-articles-multistream.xml.bz2",
]
# 덤프를 result_path 아래에 먼저 받아 두기 (약 27GB, 끊기면 이어받기). 파일 이름은 URL의 마지막 부분
wikipedia_download = true
# 다 받은 덤프를 Wikimedia가 공개하는 SHA-1과 비교 (여러 미러에서 섞어 받을 수 있으므로 켜 두기를 권장).
# 다르면 파일을 <이름>.bad로 옮기고 멈춤. 체크섬 파일을 못 구하면 경고만 하고 진행
wikipedia_verify = true
# 파일 이름을 직접 정하려면 (예: 이미 받아 둔 덤프)
# wikipedia_dump_file = "enwiki-latest-pages-articles.xml.bz2"
# 문서 표본 비율 (0 초과 1 이하, 제목 해시로 덤프 전체에서 고르게). 1 = 전부
wikipedia_sample = 1.0
# 덤프 앞쪽 N개 문서만 분석 (0 = 전체). 오래된 문서 위주라 편향되므로 빠른 확인용
wikipedia_limit = 0
# 최적화에 쓸 빅그램·트라이그램의 누적 빈도 비율 (1.0 = 전부, 낮출수록 빠름). 코퍼스 파일에는 전체를 저장하므로 바꿔도 재분석 불필요
bigram_coverage = 0.99
# 트라이그램 0.90이면 SFB·시저스가 약 13% 덜 잡힘 (위키 문서 3.5만 개 실측). 0.97은 약 6%, 0.99는 약 3% (이동 계산 1.6배·2.5배 느림)
trigram_coverage = 0.97
# 코퍼스 빈도 최하위 n글자를 가운데 두 열(검지 안쪽)에 강제 배치, 나머지 글자는 센터 금지 (0 = 끔, 2~6)
center_rare = 4
# 난수 시드 (없으면 실행 시 출력되는 값을 넣어 재현)
# seed = 12345

[weights]
gap = 0.90
row = 0.97
center = 2.5
outroll = 0.70
# 리다이렉트(같은 손 세 키가 방향을 바꿈) 배율. 음수 = 페널티: 홈 행에서 가장 작고, 노력값이 큰 키·행 이동·손가락 간격이 있을수록 커짐.
# 양수 = 보너스 (롤처럼 쉬운 키일수록 큼)
redirect = -1.5
# 나쁜 방향 하프 시저스 (인접 손가락 한 줄 차이, 긴 손가락이 아래): 롤이 아닌 시저스로 분류, 페널티 배율
half_scissors = 1.0
# 풀 시저스 중 편한 방향(긴 손가락이 위, 예: 중지 윗줄 + 검지 아랫줄) 페널티 배율. 나쁜 방향은 1.0 (1 = 구분 없음)
full_scissors_good = 0.5
# 스킵 풀 시저스(1·3번 키가 인접 손가락 두 줄 차이, 가운데 아무 키) 페널티 배율. 방향 구분은 풀 시저스와 같음. 0 = 끔
skip_scissors = 0.5
# 같은 손가락 스킵그램(사이에 다른 손가락 한 번) 페널티 배율. SFB와 같은 식에 곱함 (1 = SFB와 같은 무게).
# 사이에 한 번 치는 동안 손가락이 미리 움직일 수 있어 SFB보다 덜 불편하므로 낮춰 둠
sfs = 0.5

[costs]
# 총점 = 모든 항목을 "검지 홈 행 키 한 번 = 1" 단위의 비용으로 바꿔 더한 값 (결과에 글자 100개당 비용으로 표시).
# 대표 사건 한 번이 검지 홈 행 키를 몇 번 누르는 만큼인지. 나머지 사건은 [weights] 세부 배율로 자동 결정
# 키 노력값 배율 (1 = 노력값 표 그대로)
effort = 1.0
# SFB 한 번 (검지 홈 → 검지 윗줄)
sfb = 2.5
# 나쁜 방향 풀 시저스 한 번 (중지 아랫줄 → 검지 윗줄). 하프 시저스·편한 방향·스킵 시저스는 [weights] 배율로 이 값에서 줄어듦
full_scissors = 8.0
# 안쪽 롤 한 번으로 아끼는 양 (중지 홈 → 검지 홈). 바깥쪽 롤은 outroll 배, 리다이렉트는 redirect 배
inroll = 3.0

[sa]
max_no_improve = 1500
accept_start = 0.3
cooling = 0.998

[ga]
population = 40
tournament = 3
# 최고 점수가 이 세대 수 동안 안 오르면 종료 (없으면 population 값)
max_stall = 40
