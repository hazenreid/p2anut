[package]
name = "p2anut"
version = "0.1.0"
edition = "2024"
default-run = "p2anut"

[dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
bzip2 = "0.4"
quick-xml = "0.36"
anyhow = "1"
fastrand = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bincode = "1"
ctrlc = "3.5.2"
sha1 = "0.10"
serde_json = "1"
flate2 = "1"
tar = "0.4"
